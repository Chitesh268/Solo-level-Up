<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000308" />
    <meta name="description" content="ARISE Player System — a personal Solo Leveling style real-life progress tracker." />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" /></noscript>
    <title>ARISE — Player System</title>
    <style>html,body{background:#000;margin:0}</style>
  </head>
  <body>
    <div id="root"><div id="boot" style="min-height:100vh;display:grid;place-items:center;color:#7fdcff;font:600 14px/1.6 system-ui,sans-serif;letter-spacing:.3em;text-align:center;padding:24px">ARISE · SYSTEM LOADING…</div></div>
    <script>window.addEventListener('error',function(e){var b=document.getElementById('boot');if(!b)return;var t=e.target&&(e.target.src||e.target.href);var m=t?'Could not load '+t:String(e.message||'unknown error');b.innerHTML='ARISE FAILED TO START<br><small style="letter-spacing:.05em;color:#ff9db0">'+m.slice(0,200)+'<br>Check that Pages source is set to GitHub Actions, then reload.</small>';},true);</script>
    <noscript><p style="color:#9fe;font-family:sans-serif;padding:24px">ARISE needs JavaScript enabled.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
